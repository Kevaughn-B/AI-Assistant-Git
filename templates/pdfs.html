{% extends 'base.html' %}{% block content %}<section class="panel"><h1>Your PDFs</h1><p><a class="button" href="{{ url_for('extract_text') }}">Upload PDF</a></p>{% if files %}<table><tr><th>Filename</th><th>Uploaded</th><th>Actions</th></tr>{% for file in files %}<tr><td>{{ file.filename }}</td><td>{{ file.uploaded_at }}</td><td><a href="{{ url_for('view_pdf', file_id=file.id) }}">Read</a> · <a href="{{ url_for('download_pdf', file_id=file.id) }}">Download</a><form class="inline" method="post" action="{{ url_for('delete_pdf', file_id=file.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link danger">Delete</button></form></td></tr>{% endfor %}</table>{% else %}<p>You have not uploaded any PDFs yet.</p>{% endif %}</section>{% endblock %}
