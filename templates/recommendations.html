{% extends 'base.html' %}{% block content %}<section class="panel"><h1>Resources for “{{ query }}”</h1>{% if results %}<ol>{% for item in results %}<li><a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{{ item.title }}</a> <small>{{ item.type }}</small></li>{% endfor %}</ol>{% else %}<p>No resources were found. Try a broader topic.</p>{% endif %}<a class="button" href="{{ url_for('recommend') }}">Search again</a></section>{% endblock %}
